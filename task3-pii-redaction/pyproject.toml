[project]
name = "redact-gateway"
version = "0.1.0"
description = "LLM gateway proxy that streams completions back while redacting PII (emails, SSNs, card numbers) in real time."
requires-python = ">=3.12"
dependencies = [
    "starlette==1.10.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "python-dotenv==1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
